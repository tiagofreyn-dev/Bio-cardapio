# Evolution API — 100% GRÁTIS (Oracle Cloud Free + Docker)
# Como usar:
# 1. Crie a VM gratuita (passo no chat) com Ubuntu 22.04
# 2. Copie este arquivo para a VM: scp docker-compose.evolution.yml ubuntu@SEU_IP:~/
#    Ou cole o conteúdo via nano.
# 3. Na VM: EVO_API_KEY=SUA_KEY docker compose -f docker-compose.evolution.yml up -d
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:-evolutionpg123}
      POSTGRES_DB: evolution
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
  evo:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVO_API_KEY:?Defina EVO_API_KEY no ambiente}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${PG_PASS:-evolutionpg123}@postgres:5432/evolution
      DATABASE_URL: postgresql://postgres:${PG_PASS:-evolutionpg123}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      REDIS_URI: redis://redis:6379
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
  redisdata:
